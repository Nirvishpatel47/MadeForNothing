<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin &mdash; MADE FOR NOTHING{% endblock %}</title>
  <link rel="stylesheet" href="/admin-static/css/admin.css">
  <script src="/admin-static/js/admin.js" defer></script>
</head>
<body data-mode="{% block body_mode %}default{% endblock %}">
  <div class="admin-layout">
    <header class="admin-header">
      <div class="admin-title">
        <a href="/" style="text-decoration: none; color: inherit;">MADE FOR NOTHING</a>
        <span class="admin-badge">Admin &bull; Local Only</span>
      </div>
      <nav class="admin-nav">
        <a href="/" {% if admin_section == 'posts' or not admin_section %}style="font-weight: 700;"{% endif %}>Posts</a>
        <a href="/sections" {% if admin_section == 'sections' %}style="font-weight: 700;"{% endif %}>Sections</a>
        <a href="/courses" {% if admin_section == 'courses' %}style="font-weight: 700;"{% endif %}>Courses</a>
        <a href="/payments" {% if admin_section == 'payments' %}style="font-weight: 700;"{% endif %}>Payments</a>
        <a href="/students" {% if admin_section == 'students' %}style="font-weight: 700;"{% endif %}>Students</a>
        <a href="{{ public_base_url }}" target="_blank" class="btn btn-secondary btn-sm">Public Site &nearr;</a>
      </nav>
    </header>

    {% block content %}{% endblock %}
  </div>
</body>
</html>
